# CI — TotalRecalls
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          # Core unit tests avoid live network; install light deps used by adapters
          pip install curl_cffi || true

      - name: Unit tests
        run: python -m unittest discover -s tests -q

      - name: Selftest
        run: python app.py --selftest
