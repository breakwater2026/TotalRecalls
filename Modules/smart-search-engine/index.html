<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TotalRecalls - Local AI Chat Downloader, Vector Search & RAG SQL</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {}
        }
      }
    </script>
    <style>
      /* TotalRecalls two-theme palette (mirrors totalrecalls.app) */
      :root {
        --tr-bg: #ffffff;
        --tr-panel: #f8fafc;
        --tr-panel2: #f1f5f9;
        --tr-border: #e2e8f0;
        --tr-text: #020817;
        --tr-muted: #64748b;
        --tr-accent: #2e7eff;
        --tr-accent2: #2563eb;
        --tr-good: #3f6b4f;
        --tr-bad: #ef4444;
        --tr-warn: #b57e22;
      }
      .dark {
        --tr-bg: #101113;
        --tr-panel: #18181b;
        --tr-panel2: #16181b;
        --tr-border: #2b2c31;
        --tr-text: #e8eaed;
        --tr-muted: #9ca1ab;
        --tr-accent: #2e7eff;
        --tr-accent2: #2563eb;
        --tr-good: #5e8a68;
        --tr-bad: #c8664a;
        --tr-warn: #c88a2b;
        }
        </style>
        <script>
        (function () {
          try {
            var stored = localStorage.getItem('tr-theme');
            var wantsDark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (wantsDark) document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');
          } catch (e) {}
        })();
        </script>
        <script type="importmap">{
  "imports": {
    "react": "https://www.gstatic.com/agent-platform/modules/v1/react@19.2.7.4d5517570685122f.js",
    "react-dom": "https://www.gstatic.com/agent-platform/modules/v1/react-dom@19.2.7.65799deb8803db6e.js",
    "react-dom/client": "https://www.gstatic.com/agent-platform/modules/v1/react-dom@19.2.7.65799deb8803db6e.js",
    "@google/genai": "https://www.gstatic.com/agent-platform/modules/v1/@google/genai@2.27.0.559e6b6b4b63c2ff.js",
    "lucide-react": "https://www.gstatic.com/agent-platform/modules/v1/lucide-react@0.577.0.2bae552a4f75f2ab.js",
    "recharts": "https://www.gstatic.com/agent-platform/modules/v1/recharts@3.10.1.6c82ab2514c601f8.js"
  }
}</script>
  </head>
  <body class="bg-[var(--tr-bg)] text-[var(--tr-text)] antialiased selection:bg-[var(--tr-accent)] selection:text-[var(--tr-text)] dark font-sans">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
