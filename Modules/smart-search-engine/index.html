<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TotalRecalls Smart Search Engine (SSE)</title>
    <!-- Compiled Local Tailwind CSS (100% offline, zero cloud egress) -->
    <link rel="stylesheet" href="./dist/tailwind.css" />
    <style>
      /* TotalRecalls two-theme palette (Brand Style Guide v1.0 — mirrors totalrecalls.app) */
      :root {
        --tr-bg: #ffffff;
        --tr-panel: #f7f7f8;
        --tr-panel2: #efece6;
        --tr-border: #e4e4e7;
        --tr-text: #18181b;
        --tr-muted: #71717a;
        --tr-accent: #b57e22;
        --tr-accent2: #c88a2b;
        --tr-on-amber: #111315;
        --tr-steel: #4e6478;
        --tr-good: #3f6b4f;
        --tr-bad: #b4543a;
        --tr-warn: #b57e22;
      }
      .dark {
        --tr-bg: #111315;
        --tr-panel: #1a1d21;
        --tr-panel2: #16191d;
        --tr-border: #2a2f36;
        --tr-text: #f3efe7;
        --tr-muted: #b5aea3;
        --tr-accent: #c88a2b;
        --tr-accent2: #d69a3d;
        --tr-on-amber: #111315;
        --tr-steel: #7a8fa6;
        --tr-good: #5e8a68;
        --tr-bad: #c8664a;
        --tr-warn: #c88a2b;
        }
        </style>
        <script>
        (function () {
          try {
            var stored = localStorage.getItem('tr-theme');
            var wantsDark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (wantsDark) document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');
          } catch (e) {}
        })();
        </script>
  </head>
  <body class="bg-[var(--tr-bg)] text-[var(--tr-text)] antialiased selection:bg-[var(--tr-accent)] selection:text-[var(--tr-on-amber)] dark font-sans">
    <div id="root"></div>
    <script src="./dist/bundle.js"></script>
  </body>
</html>
