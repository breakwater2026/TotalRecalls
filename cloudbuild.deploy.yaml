# TotalRecalls Cloud Build — for one-off deploy from any branch
# Usage:
#   gcloud builds submit --config=cloudbuild.deploy.yaml \
#     --substitutions=_SERVICE=totalrecalls-web,_REGION=us-central1 \
#     --branch=Redesign
# Or via console: Build type = "Cloud Build configuration file", path = cloudbuild.deploy.yaml
#
# This file builds the Astro site (multi-stage Dockerfile) and deploys
# a new revision to the existing Cloud Run service.
# HTTP/2 end-to-end must be OFF (H2C vs HTTP/1.1 static server = 502s).

substitutions:
  _SERVICE: totalrecalls-web
  _REGION: us-central1

options:
  logging: CLOUD_LOGGING_ONLY
  # Exclude node_modules, dist, .astro from the build context
  # (these are generated artifacts; .dockerignore is NOT read by gcloud builds submit,
  #  so we rely on .dockerignore in the Dockerfile's COPY)

steps:
  # 1) Build container from repo-root Dockerfile (multi-stage)
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE}:$COMMIT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE}:latest
      - .

  # 2) Push
  - name: gcr.io/cloud-builders/docker
    id: push
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE}

  # 3) Deploy Cloud Run (allow unauthenticated — public marketing site)
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE}:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=256Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=5
      # CRITICAL: HTTP/2 must be OFF (Cloud Run default is already HTTP/1.1,
      # but be explicit to avoid 502s from H2C against python http.server)
      - --no-use-http2

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE}:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE}:latest
