# nginx for TotalRecalls static site on Google Cloud Run.
# Keep this minimal — Cloud Run is picky about upstream protocol/listen.

server {
    # IPv4 only. Some Cloud Run sandboxes mishandle listen [::]:8080.
    listen 8080 default_server;
    server_name _;

    # Prevent Location: http://host:8080/... when Cloud Run sets Host with :8080
    absolute_redirect off;
    port_in_redirect off;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;

    # Health check — must be cheap and always 200
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }

    # Static site
    location / {
        try_files $uri $uri/ $uri.html /index.html =404;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
