# Optional nginx path kept for reference / local docker.
# Production Cloud Run image currently uses Python http.server (Dockerfile)
# because nginx misconfig caused 502 protocol errors on first deploy.
#
# If you switch Dockerfile back to nginx, keep:
#   - listen on IPv4 only (no [::])
#   - absolute_redirect off;
#   - port_in_redirect off;
#   - ENTRYPOINT that respects $PORT

server {
    listen 8080 default_server;
    server_name _;
    absolute_redirect off;
    port_in_redirect off;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        default_type text/plain;
        return 200 'ok\n';
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
