# nginx site config for TotalRecalls static marketing site on Cloud Run.
#
# CRITICAL (learned on topmoneytools.com):
# Cloud Run forwards Host: <public-host>:8080 over plain HTTP inside the
# container. With absolute_redirect on (default), nginx turns relative
# redirects into Location: http://totalrecalls.app:8080/... which is dead
# on the public internet. Keep absolute_redirect off.
#
# listen MUST be 8080 — Cloud Run's default PORT.

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    absolute_redirect off;
    port_in_redirect off;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Reasonable upload limit (not used for static site, safety)
    client_max_body_size 1m;

    # Gzip text assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Security headers (site is static marketing + download links)
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Health / readiness — Cloud Run and load balancers
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Pretty URLs: /support → support.html if present
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # HTML: short cache during beta (easy to iterate)
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=300, must-revalidate";
        try_files $uri =404;
    }

    # Immutable-ish static (if any assets added later)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # No directory listings
    autoindex off;

    # Hide dotfiles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
