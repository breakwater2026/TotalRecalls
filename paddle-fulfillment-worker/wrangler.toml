name = "paddle-webhook"
main = "src/worker.js"
compatibility_date = "2024-09-25"

account_id = "348a35e76cee14de8028300ab71de1d1"

# Routes on totalrecalls.app
[[routes]]
pattern = "totalrecalls.app/health*"
zone_name = "totalrecalls.app"
[[routes]]
pattern = "totalrecalls.app/api/licenses*"
zone_name = "totalrecalls.app"
[[routes]]
pattern = "totalrecalls.app/webhook/paddle*"
zone_name = "totalrecalls.app"

# D1 database (tr-website-db)
[[d1_databases]]
binding = "DB"
database_name = "tr-website-db"
database_id = "903321ec-7dcf-4d9b-ae66-edeb76954311"

# KV Namespace (retained)
[[kv_namespaces]]
binding = "EMAILS_KV"
id = "14c867f2677c453b85b2c2d2e0cba711"
