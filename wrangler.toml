# Cloudflare — totalrecalls.app
# Static marketing site: Astro 5 build in /site -> site/dist
# Solution A per Cloudflare diagnostic: [assets] directory must exist at deploy time.
# For git-connected deploys, ALSO set in the dashboard:
#   Production branch: RedesignV7
#   Root directory:    (empty — repo root)
#   Build command:     cd site && npm ci --legacy-peer-deps && npm run build
#   Output directory:  site/dist

name = "totalrecalls"
compatibility_date = "2026-08-16"

[assets]
directory = "site/dist"
